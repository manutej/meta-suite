<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 L2,4 Z" fill="#0C0B0A"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 L2,4 Z" fill="#0C0B0A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 L2,5 Z" fill="#58A6FF"/>
    </marker>
  </defs>

  <!-- warm paper background -->
  <rect x="0" y="0" width="1100" height="680" fill="#F4EFE7"/>

  <!-- title -->
  <text x="550" y="48" text-anchor="middle" font-size="30" fill="#0C0B0A" font-weight="bold">The meta-meta space — two axes that close a loop</text>

  <!-- ===== MAKE axis label ===== -->
  <text x="60" y="135" font-size="22" fill="#0C0B0A" font-weight="bold">MAKE axis</text>

  <!-- MAKE nodes: gold accent -->
  <!-- node helper: rough rectangle drawn as irregular path -->
  <g>
    <path d="M70,150 L262,148 L266,219 L66,222 Z" fill="#FBF4E4" stroke="#E2B65A" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="167" y="192" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-prompting</text>

    <path d="M320,151 L512,148 L515,220 L317,221 Z" fill="#FBF4E4" stroke="#E2B65A" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="416" y="192" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-planning</text>

    <path d="M570,149 L762,151 L760,221 L567,219 Z" fill="#FBF4E4" stroke="#E2B65A" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="666" y="192" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-design</text>

    <path d="M820,150 L1012,149 L1015,221 L817,220 Z" fill="#FBF4E4" stroke="#E2B65A" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="916" y="192" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-mvp</text>
  </g>

  <!-- MAKE chain arrows -->
  <path d="M268,186 Q294,184 316,186" fill="none" stroke="#0C0B0A" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <path d="M517,185 Q544,183 566,185" fill="none" stroke="#0C0B0A" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <path d="M763,186 Q792,184 815,186" fill="none" stroke="#0C0B0A" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- ===== meta-craft banner spanning both axes ===== -->
  <g>
    <path d="M150,300 L950,296 L968,318 L950,372 L150,376 L132,346 Z" fill="#EFE6D2" stroke="#0C0B0A" stroke-width="3" stroke-linejoin="round"/>
    <text x="550" y="344" text-anchor="middle" font-size="22" fill="#0C0B0A" font-weight="bold">meta-craft — the standard carried across both axes</text>
  </g>

  <!-- ===== KEEP axis label ===== -->
  <text x="60" y="455" font-size="22" fill="#0C0B0A" font-weight="bold">KEEP axis</text>

  <!-- KEEP nodes: teal accent -->
  <g>
    <path d="M180,470 L388,468 L392,540 L177,542 Z" fill="#E6F6F4" stroke="#43C9BC" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="284" y="512" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-review</text>

    <path d="M450,469 L662,468 L665,541 L447,540 Z" fill="#E6F6F4" stroke="#43C9BC" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="556" y="512" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-compound</text>

    <path d="M724,470 L936,469 L939,541 L721,540 Z" fill="#E6F6F4" stroke="#43C9BC" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="830" y="512" text-anchor="middle" font-size="20" fill="#0C0B0A">meta-context</text>
  </g>

  <!-- KEEP chain arrows -->
  <path d="M393,505 Q420,503 445,505" fill="none" stroke="#0C0B0A" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M666,505 Q694,503 719,505" fill="none" stroke="#0C0B0A" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== curved feedback arrow: KEEP back up to meta-prompting ===== -->
  <path d="M830,468 C940,300 720,150 270,165"
        fill="none" stroke="#58A6FF" stroke-width="3.5" stroke-dasharray="2 0" marker-end="url(#arrowBlue)"/>
  <!-- feedback label -->
  <rect x="600" y="240" width="430" height="46" rx="10" fill="#EAF2FF" stroke="#58A6FF" stroke-width="2"/>
  <text x="815" y="262" text-anchor="middle" font-size="15.5" fill="#0C0B0A">learnings + context flow back →</text>
  <text x="815" y="281" text-anchor="middle" font-size="15.5" fill="#0C0B0A">warmer, sharper next round</text>
</svg>
