name: validate

# meta-suite dogfoods its own bar: this gate keeps the plugin itself honest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests, strict skill frontmatter, bundled tool, SVGs, and links
        run: python scripts/validate.py
      - name: dist/ packages are up to date with skills/
        run: python scripts/package.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code's own plugin + marketplace validator
        run: npx -y @anthropic-ai/claude-code@2.1.306 plugin validate . --strict
