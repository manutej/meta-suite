# meta-suite v2 kernel defaults (meta-config/v1).
#
# Every threshold, mode value, rule table and canonical-unit table the kernel uses lives here, never in code
# (P6). The kernel embeds this file; a run records the sha256 of the bytes it actually used (config_hash).
# An override file named by the META_CONFIG environment variable replaces it whole (it must define every key).
#
# Source of truth for mode values: spec/v2/03-architecture.md, "Modes" table (D-066, D-068).

schema = "meta-config/v1"

# `meta run init --mode deep` resolves to this row; `meta run scope <run_dir> broad` switches to deep_broad.
[mode_aliases]
deep = "deep_narrow"
fast = "fast"

[modes.fast]
review_passes = 1
max_regions = 3
k = 1
g3_layers = "numeric"
g3_pair_cap = 50
g4 = false
r2 = "off"
loaded_layers = "L0 + core op only"
p50_minutes = 3
p90_minutes = 6

[modes.deep_narrow]
review_passes = 2
max_regions = 6
k = 3
g3_layers = "all"
g3_pair_cap = 200
g4 = true
r2 = "lite"
loaded_layers = "L0 -> L3 as needed"
p50_minutes = 10
p90_minutes = 20

[modes.deep_broad]
review_passes = 3
max_regions = 12
k = 5
g3_layers = "all"
g3_pair_cap = 600
g4 = true
r2 = "full"
loaded_layers = "L0 -> L3 as needed"
p50_minutes = 20
p90_minutes = 40

[loop]
d2_reentry_max = 1

[intake]
re_expand_max = 1

[roles]
gather = "fast"
gather_contested = "strong"
reviewer = "best"

[claims]
# Stages whose tokens may write claims (D2 gather, including a targeted re-gather).
allowed_stages = ["D2"]

[lens.pullback]
# A finding is verified when at least this many distinct independence keys agree on its key and value.
min_independent = 2
# Two numeric values on the same key (in the same canonical unit) agree when |a-b| <= tol * max(|a|,|b|).
numeric_rel_tol = 0.01
# D-087: claims agree only inside one as_of window, so "no fines as of August" and "no fines as of October" do
# not verify each other. The window is the as_of date truncated to: "day" | "month" | "year"; "none" ignores
# as_of. Undated claims form their own window. Different values in different windows are not a conflict.
as_of_window = "month"

[graph]
# Within-region entity merge. Slice 1 merges by exact normalized label only; relation-profile merging
# (scores below 1.0) arrives with D3's full version.
merge_threshold = 1.0

[independence]
# Prefixes stripped when comparing independence keys ("www.example.org" == "example.org").
strip_prefixes = ["www."]

[gates.g6]
# Matched as the start of a word, case-insensitive: "sheaf" catches "sheafs", "functor" catches "functorial".
terms = [
  "functor", "morphism", "pullback", "pushout", "colimit", "cocone", "sheaf", "sheav", "presheaf",
  "stalk", "operad", "yoneda", "adjunction", "adjoint", "monad", "cohomolog", "harmonic", "laplacian",
  "nerve", "cochain", "coboundar", "simplicial",
]
# Matched as whole tokens, case-sensitive.
tokens = ["H0", "H1", "H^0", "H^1"]
# Matched case-insensitive with any run of whitespace between words.
phrases = [
  "category theory", "natural transformation", "fails to commute", "commuting square",
  "commutative diagram", "fibre product", "fiber product", "gluing condition", "glueing condition",
  "restriction map", "global section",
]

[gates.g2]
# D-081: gathered content is data, never instructions. Claim text fields (subject, relation, object, a string
# value, the locator) matching any of these patterns are reported as injection_suspect warnings. They are
# warnings, not failures: a reviewer looks at them; the gate verdict is unchanged. RE2 syntax, matched
# case-insensitively.
injection_patterns = [
  '\bignore\s+(all\s+|any\s+)?(the\s+)?(previous|prior|above|earlier)\b',
  '\bdisregard\s+(all\s+|any\s+)?(the\s+)?(previous|prior|above|earlier|your)\b',
  '\bforget\s+(all\s+|everything\s+)?(you|your|previous|prior)\b',
  '\byou\s+are\s+(now\s+)?(an?\s+)?(ai|assistant|language\s+model|chatbot|claude|gpt)\b',
  '\byou\s+are\s+now\b',
  '\bsystem\s+prompt\b',
  '\b(new|updated|override)\s+instructions?\b',
  '\bas\s+an\s+ai\b',
  '\b(assistant|claude|chatgpt|ai\s+model|language\s+model)\s*[,:]\s*(please\s+)?(do|ignore|output|write|say|reply|respond|include|add|delete|run|execute)\b',
  '\b(do\s+not|don.t)\s+(tell|mention|reveal|disclose)\s+(the\s+)?(user|reader)\b',
  '<\s*/?\s*(system|instructions?|assistant)\s*>',
  '\[\s*(system|inst)\s*\]',
  '\bjailbreak\b',
]

[ledger]
# Kinds accepted by `meta ledger append --kind`. deviation (D-080): a place the model departed from an op.
kinds = ["assumption", "attestation", "deviation", "note", "retry", "usage", "user_input"]

[artifact.forms]
profile = "profile page"
compare = "decision workbench, tensions first"
synthesize = "atlas or report"
monitored = "dashboard"
mechanism = "animated explainer"

[artifact.layout]
hub_first_min_hub_concentration = 0.35
sequential_min_longest_chain = 4
split_min_two_sidedness = 0.6
timeline_min_temporal_density = 0.4

[report]
# Gates listed in how_checked.json. A gate with no recorded result is reported "unchecked", with the reason.
gates = ["G1", "G2", "G3", "G4", "G5", "G6", "G7"]
# Gates this build implements; the others are reported unchecked as "not part of this build".
implemented = ["G1", "G2", "G6"]

[check]
# `meta check` (the local gate, D-052): spec atom count (D-065: 25 core + 9 specialist) and the L0 word cap.
atom_count = 34
skill_max_words = 500

# Canonical units (D-043). A claim's unit is matched case-sensitively against each dimension's factors; the
# value is multiplied by the factor and the claim's unit becomes the canonical one. A canonical unit (e.g. "%")
# is accepted as is. Unknown units are kept as given and noted. Currencies are in [unit_codes] below.
[units.length]
canonical = "m"
factors = { "m" = 1.0, "km" = 1000.0, "cm" = 0.01, "mm" = 0.001, "mi" = 1609.344, "ft" = 0.3048, "in" = 0.0254 }

[units.mass]
canonical = "kg"
factors = { "kg" = 1.0, "g" = 0.001, "mg" = 0.000001, "t" = 1000.0, "lb" = 0.45359237 }

[units.duration]
canonical = "s"
factors = { "s" = 1.0, "ms" = 0.001, "min" = 60.0, "h" = 3600.0, "day" = 86400.0, "d" = 86400.0 }

[units.data]
canonical = "B"
factors = { "B" = 1.0, "KB" = 1000.0, "MB" = 1000000.0, "GB" = 1000000000.0, "TB" = 1000000000000.0, "KiB" = 1024.0, "MiB" = 1048576.0, "GiB" = 1073741824.0 }

[units.ratio]
canonical = "%"
factors = { "%" = 1.0, "percent" = 1.0, "pct" = 1.0, "bp" = 0.01 }

[units.power]
canonical = "W"
factors = { "W" = 1.0, "kW" = 1000.0, "MW" = 1000000.0, "GW" = 1000000000.0 }

[units.energy]
canonical = "Wh"
factors = { "Wh" = 1.0, "kWh" = 1000.0, "MWh" = 1000000.0, "GWh" = 1000000000.0, "TWh" = 1000000000000.0 }

[units.count]
canonical = "count"
factors = { "count" = 1.0, "thousand" = 1000.0, "million" = 1000000.0, "billion" = 1000000000.0 }

# Code-only dimensions (D-087, D-097): a unit matching the pattern is its own canonical unit and is never
# converted (there is no static exchange rate). list = "iso4217" also requires the code to be in ISO 4217 (the
# CLDR list embedded in the kernel via golang.org/x/text/currency), so "FTE" or "KWH" is never read as money.
# A relation whose unit_dimension names one of these needs a unit, upper-cased before matching
# ("eur" -> "EUR"). Values in two codes on one key are a disagreement in units the kernel cannot convert.
[unit_codes.currency]
pattern = '^[A-Z]{3}$'
list = "iso4217"
# ISO 4217 codes that are not money a price or fine is stated in: precious metals, units of account and bond
# units, testing and "no currency" codes, and fund codes.
exclude = [
  "XAG", "XAU", "XPD", "XPT", "XDR", "XSU", "XUA", "XBA", "XBB", "XBC", "XBD", "XTS", "XXX",
  "BOV", "CHE", "CHW", "CLF", "COU", "MXV", "USN", "UYI", "UYW",
]
